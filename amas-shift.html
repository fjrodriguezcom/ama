function moveBox(o,dx,dy,sol){
  if(dx){o.x+=dx;const r={x:o.x+o.hb.ox,y:o.y+o.hb.oy,w:o.hb.w,h:o.hb.h};for(const s of sol)if(overlap(r,s)){o.x=dx>0?s.x-o.hb.w-o.hb.ox:s.x+s.w-o.hb.ox;r.x=o.x+o.hb.ox}}
  if(dy){o.y+=dy;const r={x:o.x+o.hb.ox,y:o.y+o.hb.oy,w:o.hb.w,h:o.hb.h};for(const s of sol)if(overlap(r,s)){o.y=dy>0?s.y-o.hb.h-o.hb.oy:s.y+s.h-o.hb.oy;r.y=o.y+o.hb.oy}}}

  if(t>3)txt('AMA HA SOBREVIVIDO A UN DIA COMPLETO',W/2,34,{a:'c',c:'#ffd9f0',o:'#1a0a24'});
  MEDALS.forEach(([l1,l2,k],i)=>{const at=4+i*1.1;if(t<at)return;const cx=66+i*84,off=Math.round(Math.max(0,1-(t-at)/.25)*-24),cy=62+off;
    if(t-at<.35){ctx.globalAlpha=1-(t-at)/.35;px(cx-16,cy-16,32,32,'#fff8c0');ctx.globalAlpha=1}
    drawMedal(cx,cy,k,t+i*.5);txt(l1,cx,78,{a:'c',c:'#fff',o:'#1a0a24'});txt(l2,cx,87,{a:'c',c:'#ffe066',o:'#1a0a24'})});
  if(t>8.6){txt('PUNTUACION FINAL',150,102,{a:'c',c:'#cfc6ff',o:'#1a0a24'});const n=Math.floor(G.score*clamp((t-8.6)/1.5,0,1));txt(String(n).padStart(6,'0'),150,112,{a:'c',s:2,c:'#ffe066',o:'#000'});
    if(G.newHi&&t>10.2&&Math.floor(t*3)%2===0)txt('¡NUEVO RECORD!',150,130,{a:'c',c:'#ff5a6e',o:'#000'})}
  if(t>10.4){const R=RANKS[G.lives]||RANKS[1],sc=t<10.55?7:5;txt('RANGO',300,93,{a:'c',c:'#cfc6ff',o:'#1a0a24'});txt(R[0],300,sc===7?104:110,{a:'c',s:sc,c:R[2],o:'#1a0a24'});txt(R[1],300,148,{a:'c',c:R[2],o:'#1a0a24'})}
  px(0,198,W,18,'rgba(10,6,20,.75)');
  if(t>11.5){txt('¡GRACIAS POR JUGAR!',W/2,199,{a:'c',c:'#fff',sh:0});if(Math.floor(t*2)%2===0)txt(ACT+' PARA VOLVER AL TITULO',W/2,208,{a:'c',c:'#ffe066',sh:0})}
  else txt(ACT+': SALTAR',W-4,204,{a:'r',c:'#6a5a9a',sh:0})}

function drawOver(){px(0,0,W,H,'#0b0914');for(let y=0;y<H;y+=4)px(0,y,W,1,'rgba(255,255,255,.02)');txt('GAME OVER',W/2,36,{a:'c',s:4,c:'#ff4a5a',o:'#2a0010'});
  blit(AMA.work.up[0],W/2-18,80,false,3);txt('PUNTUACION '+G.score,W/2,148,{a:'c',s:2,c:'#ffe066'});txt('RECORD '+G.hi,W/2,168,{a:'c',c:'#cfc6ff'});
  if(G.t>1&&Math.floor(G.t*2)%2===0)txt(ACT+' PARA REINICIAR',W/2,190,{a:'c',c:'#fff'})}

function update(dt){G.t+=dt;pops.forEach(p=>{p.life-=dt;p.y-=18*dt});pops=pops.filter(p=>p.life>0);if(G.shake>0)G.shake-=dt;if(G.ban){G.ban.t-=dt;if(G.ban.t<=0)G.ban=null}
  if(pressed.mute)toggleMute();
  switch(G.state){
    case 'boot':if(G.any){G.state='title';G.t=0;playMusic('title')}break;
    case 'title':{if(pressed.left){G.sel=(G.sel+3)%4;SFX.beep()}if(pressed.right){G.sel=(G.sel+1)%4;SFX.beep()}for(let i=1;i<=4;i++)if(pressed['p'+i]){G.sel=i-1;SFX.select();startGame(G.sel)}if(G.state==='title'&&pressed.act){SFX.select();startGame(G.sel)}}break;
    case 'intro':if(pressed.act&&G.t>.4){SFX.select();G.state='play';G.t=0}break;
    case 'play':if(pressed.pause){G.paused=!G.paused;G.pm=0;SFX.select()}if(G.paused){if(pressed.up||pressed.down){G.pm=1-G.pm;SFX.beep()}if(pressed.act){if(G.pm===0)G.paused=false;else{G.paused=false;G.state='title';G.t=0;G.sel=0;G.ban=null;pops=[];playMusic('title')}SFX.select()}break}G.phase.update(dt);
      if(G.phase.result==='win'){G.state='clear';G.t=0;G.score+=G.phase.bonus;saveHi();SFX.win()}
      else if(G.phase.result==='fail'){G.state='fail';G.t=0;G.lives--;stopMusic();SFX.life();shake(.3)}break;
    case 'clear':if(pressed.act&&G.t>1){G.pi++;if(G.pi>=PHASES.length){G.state='ending';G.t=0;saveHi();endReset();stopMusic();playMusic('finale')}else toIntro()}break;
    case 'fail':if(pressed.act&&G.t>1){if(G.lives>0)toIntro();else{G.state='over';G.t=0;saveHi();SFX.over()}}break;
    case 'ending':endUpdate(dt);break;
    case 'over':if(pressed.act&&G.t>1.2){G.state='title';G.t=0;G.sel=0;playMusic('title')}break}}
function draw(){ctx.save();if(G.shake>0)ctx.translate(ri(-2,2),ri(-2,2));
  switch(G.state){
    case 'boot':drawBoot();break;
    case 'title':drawTitle();break;
    case 'intro':drawIntro();break;
    case 'play':case 'clear':case 'fail':G.phase.draw();
      if(G.ban){px(0,24,W,15,'rgba(10,6,20,.8)');txt(G.ban.m,W/2,28,{a:'c',c:'#ffe066'})}
      for(const p of pops){ctx.globalAlpha=Math.min(1,p.life*2);txt(p.t,p.x,p.y,{a:'c',c:p.c,o:'#000'});ctx.globalAlpha=1}
      if(G.state==='play'&&G.paused){panel(64,88);txt('PAUSA',W/2,74,{a:'c',s:2,c:'#fff'});['CONTINUAR','SALIR AL TITULO'].forEach((o,i)=>txt((G.pm===i?'> ':'  ')+o,W/2,100+i*14,{a:'c',c:G.pm===i?'#ffe066':'#8a7ab0'}));txt('ARRIBA/ABAJO Y '+ACT,W/2,136,{a:'c',c:'#cfc6ff'})}
      if(G.state==='clear'){panel(60,92);txt('¡FASE SUPERADA!',W/2,72,{a:'c',s:2,c:'#5fd35f',o:'#000'});txt('BONUS +'+G.phase.bonus,W/2,98,{a:'c',c:'#ffe066'});txt('PUNTOS '+G.score,W/2,112,{a:'c',c:'#fff'});
        if(G.t>1&&Math.floor(G.t*2)%2===0)txt(ACT+' PARA CONTINUAR',W/2,134,{a:'c',c:'#9fe8ff'})}
      if(G.state==='fail'){panel(60,92);txt('¡OH, NO!',W/2,70,{a:'c',s:2,c:'#ff5a6a',o:'#000'});txt(G.phase.failMsg,W/2,94,{a:'c',c:'#fff'});
        for(let i=0;i<3;i++)blit(i<G.lives?HEART:HEART0,W/2-14+i*10,110);
        if(G.t>1&&Math.floor(G.t*2)%2===0)txt(G.lives>0?ACT+' PARA REINTENTAR':ACT+' PARA CONTINUAR',W/2,134,{a:'c',c:'#9fe8ff'})}
      break;
    case 'over':drawOver();break;
    case 'ending':drawEnding();break}
  ctx.restore();if(isTouch&&innerHeight>innerWidth){px(0,0,W,H,'rgba(10,6,20,.92)');txt('GIRA EL MOVIL',W/2,90,{a:'c',s:3,c:'#ffd166'});txt('ESTE JUEGO SE JUEGA EN HORIZONTAL',W/2,124,{a:'c',c:'#fff'})}if(muted)txt('MUTE',W-4,H-10,{a:'r',c:'#ff7070'})}
let last=performance.now();
function frame(now){const dt=clamp((now-last)/1000,0,.05);last=now;update(dt);draw();for(const k in pressed)delete pressed[k];requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
</body>
